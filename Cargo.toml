[package]
name = "aiwars-mcp-lasertango"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "aiwars_mcp_lasertango"
path = "src/lib.rs"

[[bin]]
name = "aiwars-mcp-lasertango"
path = "src/main.rs"

[dependencies]
# Git-dep pinned to a commit of the (private) AIWars repo. lasertango is tier-1 (it reuses the
# turn-based gamepad, the control/view servers and the Seat API), so it needs NO rmcp/axum/
# tokio/tower/sha2/schemars deps of its own — the library owns every server. Cargo.lock is
# committed, which is what keeps rmcp-macros pinned to rmcp's 1.7.0 (an unlocked resolve floats
# it to 1.8.0 and the build fails); same rev/shape as aiwars-poker, the reference tier-1 game.
aiwars-minigame = { git = "https://github.com/AsafFisher/AIWars", package = "aiwars-minigame", rev = "af88d7c" }
serde_json = "1"
anyhow = "1"
